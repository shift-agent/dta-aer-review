<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos — Simplitory</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/simplitory.css?v=3">
<link rel="stylesheet" href="assets/present.css">
<style>
  /* "Fix my photos" — simplified per R3, then reworked to Glenn's punch-list:
     hero + meter on one row (2 col); product-page search+filter; Start-here and
     AI scene as toolbar buttons. Squared, consumes --sy-* tokens. */
  .ph-mono { --ph-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── hero: heading + text (left) · coverage meter (right), one row ── */
  .ph-hero { background: var(--sy-surface); border: 1px solid var(--sy-line); padding: 20px 22px; margin-bottom: 16px; }
  .ph-hero__grid { display: grid; grid-template-columns: 1fr minmax(260px, 38%); gap: 30px; align-items: center; }
  .ph-hero__big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ph-hero__n { font-size: 2.5rem; font-weight: 800; line-height: 1; color: var(--sy-bad); letter-spacing: -.02em; }
  .ph-hero__lab { font-size: 1rem; font-weight: 700; color: var(--sy-ink); }
  .ph-hero__ctx { font-size: .8rem; color: var(--sy-muted); margin: 8px 0 0; }
  .ph-hero__ctx b { color: var(--sy-ok); font-weight: 700; }
  .ph-meter__h { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sy-muted); font-weight: 700; margin: 0 0 8px; }
  .ph-prog { display: flex; height: 12px; border: 1px solid var(--sy-line); overflow: hidden; background: var(--sy-fill); }
  .ph-prog .have { background: var(--sy-ok); } .ph-prog .low { background: var(--sy-warn); }
  .ph-prog__cap { font-size: .72rem; color: var(--sy-muted); margin: 8px 0 0; }
  .ph-prog__cap b { color: var(--sy-ink-2); }
  @media (max-width: 760px) { .ph-hero__grid { grid-template-columns: 1fr; gap: 18px; } }

  /* ── toolbar buttons (reuses .pbar/.psearch/.pfilterpop/.fchip from simplitory.css) ── */
  .startwrap { position: relative; }
  .btn--start { background: var(--sy-warn); border-color: var(--sy-warn); color: #fff; }
  .btn--start:hover { filter: brightness(0.9); border-color: var(--sy-warn); color: #fff; }
  .btn--ai { background: #5A54D6; border-color: #5A54D6; color: #fff; display: inline-flex; align-items: center; gap: 6px; }
  .btn--ai:hover { filter: brightness(0.9); border-color: #5A54D6; color: #fff; }
  .btn--ai svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .btn--ai small { font-size: .58rem; font-weight: 700; letter-spacing: .04em; border: 1px solid rgba(255,255,255,.45); padding: 1px 4px; }
  .startpop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; width: min(430px, 90vw);
    background: var(--sy-surface); border: 1px solid var(--sy-line); box-shadow: 0 14px 34px rgba(20,32,46,.16); padding: 14px 15px; }
  .startpop[hidden] { display: none; }
  .startpop h4 { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sy-muted); font-weight: 700; margin: 0 0 3px; }
  .startpop p { font-size: .72rem; color: var(--sy-muted); margin: 0 0 11px; }
  .startpop__row { display: flex; flex-wrap: wrap; gap: 7px; }
  .startchip { font: inherit; text-align: left; cursor: pointer; background: var(--sy-fill);
    border: 1px solid var(--sy-line); padding: 8px 11px; min-width: 118px; color: var(--sy-ink-2); transition: .15s; }
  .startchip:hover, .startchip.is-on { border-color: var(--sy-warn); background: color-mix(in srgb, var(--sy-warn) 9%, #fff); }
  .startchip b { display: block; font-size: .8rem; font-weight: 700; color: var(--sy-ink); }
  .startchip span { font-size: .7rem; color: var(--sy-bad); font-weight: 600; }
  .startchip.reset span { color: var(--sy-muted); }

  .bulkbar { display: none; gap: .6rem; align-items: center; background: var(--sy-ink); color: #fff;
    padding: .7rem 1rem; margin-bottom: 1rem; font-size: .82rem; }
  .bulkbar .btn { padding: .45rem .9rem; font-size: .76rem; }
  .bulkbar .ghost { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; }

  .sub2 { font-size: .78rem; color: var(--sy-muted); margin: 0 0 12px; }
  .sub2 b { color: var(--sy-ink-2); }

  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .pc { background: var(--sy-surface); border: 1px solid var(--sy-line); overflow: hidden; }
  .pc.is-sel { border-color: var(--sy-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sy-accent) 22%, transparent); }
  .pc__m { position: relative; aspect-ratio: 1/1; background: var(--sy-fill); display: grid; place-items: center; overflow: hidden; }
  .pc__m img { width: 100%; height: 100%; object-fit: cover; }
  .pc__m.is-empty { background: repeating-linear-gradient(45deg, var(--sy-fill), var(--sy-fill) 10px, #EEF1F4 10px, #EEF1F4 20px); }
  .ph { font: 700 1.4rem/1 var(--ph-mono, monospace); color: var(--sy-muted); opacity: .55; }
  .b { position: absolute; top: .4rem; left: .4rem; font: 700 9px/1 var(--ph-mono, monospace); letter-spacing: .06em;
    padding: .25rem .4rem; text-transform: uppercase; }
  .b.ok { background: color-mix(in srgb, var(--sy-ok) 14%, #fff); color: var(--sy-ok); }
  .b.low { background: color-mix(in srgb, var(--sy-warn) 16%, #fff); color: var(--sy-warn); }
  .b.miss { background: #fff; color: var(--sy-bad); border: 1px solid color-mix(in srgb, var(--sy-bad) 30%, #fff); }
  .pc__ck { position: absolute; top: .4rem; right: .4rem; width: 17px; height: 17px; cursor: pointer; accent-color: var(--sy-accent); }
  .pc__b { padding: .6rem .7rem .7rem; }
  .pc__b h4 { margin: 0 0 .2rem; font-size: .8rem; font-weight: 600; color: var(--sy-ink); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pc__b p { margin: 0 0 .5rem; font-size: .7rem; color: var(--sy-muted); }
  .pc__a { display: flex; gap: .25rem; }
  .pc__a button { flex: 1; font: inherit; font-size: .65rem; padding: .32rem .1rem; border: 1px solid var(--sy-line);
    background: var(--sy-surface); cursor: pointer; color: var(--sy-ink-2); }
  .pc__a button:hover { border-color: var(--sy-accent); color: var(--sy-accent); }
  .pc__a button.is-on { background: var(--sy-accent); border-color: var(--sy-accent); color: #fff; }
  .pc__a button.ai { border-color: color-mix(in srgb, #5A54D6 45%, #fff); color: #5A54D6; }
  .pc__a button.ai:hover { background: #5A54D6; border-color: #5A54D6; color: #fff; }
  .empty2 { color: var(--sy-muted); padding: 3rem 0; }
  .toast2 { position: fixed; left: 50%; bottom: 1.6rem; transform: translate(-50%, 1rem); background: var(--sy-ink);
    color: #fff; padding: .75rem 1.2rem; font-size: .82rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 220; max-width: 80vw; text-align: center; }
  .toast2.on { opacity: 1; transform: translate(-50%, 0); }

  /* ── AI scene modal (BYOK "see it in action") ── */
  .aimodal { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 20px; }
  .aimodal[hidden] { display: none; }
  .aimodal__scrim { position: absolute; inset: 0; background: rgba(16,22,30,.55); }
  .aimodal__panel { position: relative; width: min(920px, 96vw); max-height: 92vh; overflow: auto;
    background: var(--sy-surface); border: 1px solid var(--sy-line); box-shadow: 0 30px 70px rgba(16,22,30,.35); }
  .aimodal__hd { padding: 18px 22px 14px; border-bottom: 1px solid var(--sy-line); }
  .aimodal__hd h2 { margin: 0; font-size: 1.12rem; font-weight: 800; color: var(--sy-ink); display: flex; align-items: center; gap: 10px; }
  .aibadge { font-size: .58rem; font-weight: 800; letter-spacing: .05em; background: #5A54D6; color: #fff; padding: 3px 7px; }
  .aimodal__sub { margin: 8px 0 0; font-size: .8rem; color: var(--sy-muted); max-width: 68ch; }
  .aimodal__x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; background: var(--sy-surface);
    border: 1px solid var(--sy-line); font-size: 1.1rem; line-height: 1; cursor: pointer; color: var(--sy-ink); }
  .aimodal__x:hover { border-color: var(--sy-line-h); color: var(--sy-bad); }
  .aimodal__body { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; }
  @media (max-width: 720px) { .aimodal__body { grid-template-columns: 1fr; } }
  .aiscene { position: relative; aspect-ratio: 4/3; background: var(--sy-fill); border-right: 1px solid var(--sy-line); overflow: hidden; }
  .aiscene svg { width: 100%; height: 100%; display: block; }
  .aiscene__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* the recolour: a blend overlay tints the real photo (linen/material appears to change) */
  .aiscene__tint { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .62; pointer-events: none; }
  .aiscene__load { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(250,251,252,.92); z-index: 2; }
  .aiscene__load div { text-align: center; font-size: .8rem; color: var(--sy-ink-2); }
  .aiscene__load .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--sy-line);
    border-top-color: #5A54D6; border-radius: 50%; animation: aispin .8s linear infinite; margin-bottom: 10px; }
  @keyframes aispin { to { transform: rotate(360deg); } }
  .aiscene__tag { position: absolute; left: 12px; bottom: 12px; z-index: 1; background: rgba(16,22,30,.82); color: #fff;
    font-size: .68rem; padding: 5px 9px; }
  .aiscene__tag b { font-weight: 700; }
  .aiside { padding: 18px 20px 20px; }
  .aiside__prod { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--sy-line); margin-bottom: 14px; }
  .aiside__thumb { width: 44px; height: 44px; flex: 0 0 44px; background: var(--sy-fill); border: 1px solid var(--sy-line);
    background-size: cover; background-position: center; }
  .aiside__prod b { display: block; font-size: .82rem; color: var(--sy-ink); line-height: 1.25; }
  .aiside__prod span { font-size: .7rem; color: var(--sy-muted); }
  .aiside__lbl { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sy-muted); font-weight: 700; margin: 0 0 8px; }
  .aiswatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .aisw { width: 30px; height: 30px; border: 1px solid var(--sy-line-h); cursor: pointer; position: relative; }
  .aisw.is-on { outline: 2px solid var(--sy-ink); outline-offset: 2px; }
  .aitokens { background: var(--sy-fill); border: 1px solid var(--sy-line); padding: 12px 13px; }
  .aitok-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .aitok-head b { font-size: .8rem; color: var(--sy-ink); }
  .aitok-cached { font-size: .64rem; font-weight: 700; color: var(--sy-ok); background: color-mix(in srgb, var(--sy-ok) 12%, #fff); padding: 3px 7px; }
  .aitok-bar { display: flex; gap: 3px; margin-bottom: 9px; }
  .aitok-bar i { flex: 1; height: 6px; background: #5A54D6; }
  .aitokens p { font-size: .72rem; color: var(--sy-muted); margin: 0 0 7px; line-height: 1.45; }
  .aitokens p b { color: var(--sy-ink-2); }
  .aitok-key { font-size: .66rem !important; color: var(--sy-muted); border-top: 1px solid var(--sy-line); padding-top: 8px; margin-top: 3px !important; }
  .aiside__use { margin-top: 16px; }
</style>
</head>
<body class="sy ph-mono">

<template id="present-extras">
  <a href="products.html">Products</a>
  <span class="sep">/</span>
  <a href="photos.html">Photos</a>
  <span class="sep">/</span>
  <a href="wizard.html#media">Setup · Media step</a>
</template>

<div class="app">
  <aside class="sb" id="sb" data-sidebar></aside>
  <main class="main">
    <div class="topbar"><button class="burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button><strong>Photos</strong>
      <span class="tierctx">Plan: <b data-tier-label>Basic</b> <button class="tglt" data-tier-toggle>Unlock Pro</button></span></div>
    <p class="crumbs"><b>Simplitory</b> · Products · Photos</p>
    <h1 class="h">Fix my photos</h1>
    <p class="hsub">One thing slows launch more than anything else: most products have no photograph. Search or filter to the gaps, and use <b>Start here</b> to work the biggest wins first.</p>

    <div class="ph-hero" id="hero"></div>

    <div class="pbar">
      <div class="psearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search products…">
      </div>
      <div class="pfilterwrap">
        <button class="pfiltbtn" id="filtbtn"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg> Filter</button>
        <div class="pfilterpop" id="filtpop" hidden>
          <div class="row2"><h4>Photo</h4><div class="chips" id="statchips"></div></div>
          <div class="row2" style="margin-bottom:0"><h4>Category</h4><div class="chips" id="catchips"></div></div>
        </div>
      </div>
      <span style="flex:1"></span>
      <button class="btn btn--ai" id="aibtn"><svg viewBox="0 0 24 24"><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></svg> AI scene <small>BYOK</small></button>
      <div class="startwrap">
        <button class="btn btn--start" id="startbtn">★ Start here</button>
        <div class="startpop" id="startpop" hidden></div>
      </div>
      <button class="btn ghost" id="export">Export shoot list (<span id="shootn">0</span>)</button>
    </div>

    <div class="bulkbar" id="bulk">
      <span id="selmsg">Selected</span>
      <button class="btn" id="addshoot">Add to shoot list</button>
      <button class="btn ghost" id="selall">Select all shown</button>
      <button class="btn ghost" id="clear">Clear</button>
    </div>

    <p class="sub2" id="vcount"></p>
    <div class="pgrid" id="grid"></div>
    <div style="text-align:center;margin-top:1.6rem">
      <button class="btn ghost" id="more" style="display:none">Load more</button>
    </div>
  </main>
</div>

<div class="aimodal" id="aimodal" hidden></div>

<script src="assets/data/catalog.js"></script>
<script src="assets/js/photos.js"></script>

<div class="scrim" id="scrim"></div>

<script src="assets/js/connectors.js"></script>
<script src="assets/js/sidebar.js"></script>
<script src="assets/js/simplitory.js"></script>
<script src="assets/js/present.js?v=2"></script>
</body>
</html>
